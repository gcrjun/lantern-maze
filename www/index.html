<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}*{box-sizing:border-box}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Lantern Maze</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Layout: landscape-first. Left thumb column (pause + joystick) | square board | right thumb column (lamp, moves, dash).
   Portrait falls back to: top bar / board / joystick + dash. */
:root {
  --night: #07080d;
  --stone: #6f7c99;
  --floor: #141824;
  --lamp: #ffcf5a;
  --oil: #ff9f3a;
  --exit: #39d98a;
  --danger: #ff5a4f;
  --ink: #e7e9f2;
  --muted: #8a92a8;
  --line: #262c3d;
  --font-display: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
  --font-body: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--night);
  color: var(--ink);
  font-family: var(--font-body);
  padding-left: max(12px, env(safe-area-inset-left, 0px));
  padding-right: max(12px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color: transparent;
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
}
.app {
  box-sizing: border-box;
  height: 100%;
  padding-block: 10px;
  display: grid;
  grid-template-columns: minmax(140px, 1fr) auto minmax(140px, 1fr);
  grid-template-areas: "left board right";
  column-gap: 14px;
  align-items: stretch;
}
.left, .right { display: grid; min-width: 0; min-height: 0; }
.left { grid-area: left; grid-template-rows: auto 1fr; gap: 10px; }
.right { grid-area: right; grid-template-rows: auto 1fr; gap: 10px; }

.corner { display: flex; align-items: center; gap: 10px; }
.icon {
  width: 48px; height: 48px; flex: none;
  display: grid; place-items: center;
  border-radius: 10px; border: 1px solid var(--line);
  background: var(--floor); color: var(--ink);
  font-family: var(--font-display); font-size: 1.15rem; cursor: pointer;
}
.label { display: grid; gap: 1px; min-width: 0; }
.label small, .hud small { color: var(--muted); font-size: 0.72rem; letter-spacing: 0.08em; }
.label b, .hud b { font-family: var(--font-display); font-size: 1.15rem; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }

.stick-zone { position: relative; border-radius: 14px; touch-action: none; cursor: grab; min-height: 140px; }
.stick {
  position: absolute; left: 50%; top: 62%;
  width: 120px; height: 120px; margin: -60px 0 0 -60px;
  border-radius: 50%;
  border: 2px solid var(--line);
  background: rgba(20, 24, 36, 0.6);
  opacity: 0.55;
  pointer-events: none;
}
.stick.active { opacity: 1; border-color: var(--lamp); }
.knob {
  position: absolute; left: 50%; top: 50%;
  width: 52px; height: 52px; margin: -26px 0 0 -26px;
  border-radius: 50%; background: var(--lamp);
}
.zone-hint { position: absolute; left: 0; right: 0; bottom: 4px; margin: 0; text-align: center; color: var(--muted); font-size: 0.75rem; }

.hud { display: grid; gap: 8px; align-content: start; }
.hud-row { display: grid; gap: 3px; }
.goal { color: var(--lamp); font-size: 0.8rem; font-family: var(--font-display); font-variant-numeric: tabular-nums; white-space: nowrap; }
.gauge { height: 10px; border-radius: 5px; background: var(--floor); border: 1px solid var(--line); overflow: hidden; }
.gauge i { display: block; height: 100%; width: 100%; background: var(--lamp); transform-origin: left center; }
.gauge.low i { background: var(--danger); }
.hud small.memo { color: var(--lamp); font-family: var(--font-display); font-weight: 600; font-size: 0.8rem; }

.dash-zone { display: grid; place-items: center; min-height: 120px; }
.dash {
  width: 96px; height: 96px; border-radius: 50%;
  border: 2px solid var(--lamp); background: rgba(255, 207, 90, 0.12);
  color: var(--lamp); font-family: var(--font-display); font-weight: 600; font-size: 1.05rem;
  cursor: pointer; touch-action: none;
}
.dash:active, .dash.on { background: var(--lamp); color: var(--night); }

.board {
  grid-area: board;
  position: relative;
  align-self: center;
  aspect-ratio: 1;
  width: min(calc(100vh - 20px), calc(100vw - 360px));
  width: min(calc(100dvh - 20px), calc(100vw - 360px));
}
canvas { display: block; width: 100%; height: 100%; border-radius: 4px; touch-action: none; outline: none; }
.board.memo canvas { box-shadow: 0 0 0 2px var(--lamp); }
.banner { position: absolute; inset: 0; display: grid; justify-items: center; align-items: start; padding-top: 10px; pointer-events: none; }
.banner p { margin: 0; padding: 8px 14px; border-radius: 6px; background: rgba(7, 8, 13, 0.75); font-family: var(--font-display); }

.btn {
  font-family: var(--font-display); font-weight: 600; font-size: 0.95rem;
  padding: 9px 14px; border-radius: 8px; border: 0;
  background: var(--lamp); color: var(--night); cursor: pointer;
}
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
button:focus-visible, canvas:focus-visible { outline: 2px solid var(--lamp); outline-offset: 2px; }

.overlay { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(7, 8, 13, 0.75); overflow-y: auto; padding: 10px; }
.overlay.top { place-items: start center; }
.card { background: var(--night); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: grid; gap: 10px; text-align: center; width: min(360px, 100%); }
.card h2 { margin: 0; font-family: var(--font-display); font-size: 1.25rem; }
.card h2.win { color: var(--exit); }
.card h2.lose { color: var(--danger); }
.card p { margin: 0; color: var(--muted); font-variant-numeric: tabular-nums; line-height: 1.5; }
.card .row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.stars { font-size: 2rem; letter-spacing: 0.15em; color: var(--line); }
.stars .on { color: var(--lamp); }
.note { color: var(--lamp) !important; }

.modes { display: flex; justify-content: center; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.modes button { flex: 1; font-family: var(--font-display); font-size: 0.85rem; padding: 7px 10px; border: 0; background: transparent; color: var(--muted); cursor: pointer; }
.modes button[aria-pressed="true"] { background: var(--lamp); color: var(--night); font-weight: 600; }
.sizes { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
.chip { font-family: var(--font-display); font-size: 0.82rem; padding: 6px 9px; border-radius: 6px; border: 1px solid var(--line); background: transparent; color: var(--muted); cursor: pointer; }
.chip[aria-pressed="true"] { color: var(--ink); border-color: var(--lamp); }
.record { color: var(--muted); font-size: 0.8rem; font-variant-numeric: tabular-nums; }
.toggles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.toggle { display: grid; gap: 2px; padding: 7px 4px; border-radius: 8px; border: 1px solid var(--line); background: var(--floor); color: var(--ink); font-family: var(--font-body); font-size: 0.88rem; cursor: pointer; }
.toggle small { font-family: var(--font-display); font-size: 0.72rem; color: var(--muted); }
.toggle[aria-pressed="true"] { border-color: var(--lamp); }
.toggle[aria-pressed="true"] small { color: var(--lamp); }
.setting { display: grid; gap: 4px; text-align: left; font-size: 0.85rem; color: var(--muted); }
.steps { display: grid; gap: 4px; }
.steps.five { grid-template-columns: repeat(5, 1fr); }
.steps.three { grid-template-columns: repeat(3, 1fr); }
.step { padding: 7px 2px; border-radius: 6px; border: 1px solid var(--line); background: var(--floor); color: var(--muted); font-family: var(--font-body); font-size: 0.82rem; cursor: pointer; }
.step[aria-pressed="true"] { border-color: var(--lamp); color: var(--night); background: var(--lamp); }

.select { width: min(440px, 100%); text-align: left; }
.chapters { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
.chapter { padding: 5px 2px; border-radius: 6px; border: 1px solid var(--line); background: transparent; color: var(--muted); font-family: var(--font-display); font-size: 0.78rem; cursor: pointer; display: grid; gap: 1px; }
.chapter small { font-size: 0.66rem; color: var(--muted); }
.chapter[aria-pressed="true"] { border-color: var(--lamp); color: var(--ink); }
.chapter:disabled { opacity: 0.35; cursor: default; }
.grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.stage { display: grid; gap: 2px; place-items: center; padding: 6px 2px; border-radius: 8px; border: 1px solid var(--line); background: var(--floor); color: var(--ink); cursor: pointer; font-family: var(--font-display); font-size: 1rem; }
.stage small { font-size: 0.7rem; color: var(--line); letter-spacing: 0.1em; }
.stage small .on { color: var(--lamp); }
.stage:disabled { opacity: 0.35; cursor: default; }
.special { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.special .stage { font-size: 0.88rem; padding: 9px 6px; text-align: center; }
.special .bonus:not(:disabled) { border-color: var(--lamp); color: var(--lamp); }
.special small { color: var(--muted); letter-spacing: 0; }

.rotate-hint {
  position: fixed; left: 50%; bottom: max(12px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  display: flex; gap: 10px; align-items: center;
  padding: 8px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--floor);
  font-size: 0.85rem; color: var(--ink); z-index: 5; max-width: calc(100vw - 32px);
}
.rotate-hint button { border: 0; background: transparent; color: var(--lamp); font-family: var(--font-display); cursor: pointer; }

/* Short landscape phones: tighter menus so they fit the board. */
@media (max-height: 450px) {
  .card { gap: 6px; padding: 10px; }
  .card h2 { font-size: 1.05rem; }
  .toggle { padding: 4px; }
  .step, .modes button, .chip { padding-block: 5px; }
  .btn { padding: 7px 12px; }
}
/* Portrait fallback: top bar, board, then joystick (left) and dash (right). */
@media (orientation: portrait) {
  .app {
    grid-template-columns: 1fr 1fr;
    grid-template-rows: auto auto 1fr;
    grid-template-areas: "corner hud" "board board" "stick dash";
    row-gap: 10px;
  }
  .left, .right { display: contents; }
  .corner { grid-area: corner; }
  .hud { grid-area: hud; }
  .stick-zone { grid-area: stick; }
  .dash-zone { grid-area: dash; }
  .board {
    justify-self: center;
    width: min(100%, calc(100vh - 330px));
    width: min(100%, calc(100dvh - 330px));
  }
}
</style>

</head>
<body>
<div class="app">
  <aside class="left">
    <div class="corner">
      <button class="icon" id="pause" aria-label="일시정지">Ⅱ</button>
      <div class="label"><small id="kind-label">스테이지</small><b id="stage-label">1</b></div>
    </div>
    <div class="stick-zone" id="stick-zone" aria-label="이동 조이스틱. 왼손 엄지로 끌어서 움직입니다.">
      <div class="stick" id="stick"><div class="knob" id="knob"></div></div>
      <p class="zone-hint">왼손 엄지로 끌어서 이동</p>
    </div>
  </aside>

  <div class="board" id="board">
    <canvas id="game" tabindex="0" aria-label="미로 게임 화면. 방향키로 이동합니다."></canvas>
    <div class="banner" id="banner" hidden><p id="banner-text">기억하세요!</p></div>

    <div class="overlay" id="result" hidden>
      <div class="card">
        <h2 id="result-title" class="win">탈출 성공</h2>
        <div class="stars" id="result-stars" aria-label="별 0개"><span>★</span><span>★</span><span>★</span></div>
        <p id="result-line">0번 이동 · 최단 0</p>
        <p class="note" id="result-note" hidden></p>
        <div class="row">
          <button class="btn ghost" id="retry">다시 하기</button>
          <button class="btn" id="next">다음 스테이지</button>
        </div>
      </div>
    </div>

    <div class="overlay top" id="pause-menu" hidden>
      <div class="card">
        <h2>일시정지</h2>
        <div class="modes" role="group" aria-label="게임 모드">
          <button id="mode-stage" aria-pressed="true">스테이지</button>
          <button id="mode-free" aria-pressed="false">자유 플레이</button>
        </div>
        <button class="btn ghost" id="open-select">스테이지 선택</button>
        <div class="sizes" id="sizes" role="group" aria-label="미로 크기" hidden>
          <button class="chip" id="size-7" data-size="7" aria-pressed="false">7×7</button>
          <button class="chip" id="size-10" data-size="10" aria-pressed="true">10×10</button>
          <button class="chip" id="size-15" data-size="15" aria-pressed="false">15×15</button>
          <button class="chip" id="size-20" data-size="20" aria-pressed="false">20×20</button>
        </div>
        <span class="record" id="record" hidden></span>
        <div class="setting">
          <span>이동 속도</span>
          <div class="steps five" id="speed-steps" role="group" aria-label="이동 속도">
            <button class="step" data-value="1">느림</button>
            <button class="step" data-value="2">2</button>
            <button class="step" data-value="3">보통</button>
            <button class="step" data-value="4">4</button>
            <button class="step" data-value="5">빠름</button>
          </div>
        </div>
        <div class="setting">
          <span>조이스틱 민감도</span>
          <div class="steps three" id="stick-steps" role="group" aria-label="조이스틱 민감도">
            <button class="step" data-value="1">낮음</button>
            <button class="step" data-value="2">보통</button>
            <button class="step" data-value="3">높음</button>
          </div>
        </div>
        <div class="toggles">
          <button class="toggle" id="t-sfx" aria-pressed="true">효과음<small>켜짐</small></button>
          <button class="toggle" id="t-bgm" aria-pressed="true">배경음<small>켜짐</small></button>
          <button class="toggle" id="t-vib" aria-pressed="true">진동<small>켜짐</small></button>
        </div>
        <div class="row">
          <button class="btn ghost" id="p-restart">다시 하기</button>
          <button class="btn" id="p-resume">계속하기</button>
        </div>
      </div>
    </div>

    <div class="overlay top" id="select" hidden>
      <div class="card select">
        <h2>스테이지 선택</h2>
        <p id="select-summary">모은 별 0 / 300</p>
        <div class="chapters" id="chapters" role="group" aria-label="챕터"></div>
        <div class="grid" id="stage-grid"></div>
        <div class="special">
          <button class="stage bonus" id="bonus-btn" disabled>보너스 판<small>모두 ★★★ 필요</small></button>
          <button class="stage" disabled>추적자 모드<small>준비 중</small></button>
        </div>
        <button class="btn ghost" id="close-select">닫기</button>
      </div>
    </div>
  </div>

  <aside class="right">
    <div class="hud">
      <div class="hud-row"><small id="lamp-label">등불</small><div class="gauge" id="gauge"><i id="gauge-fill"></i></div></div>
      <div class="hud-row"><small>이동</small><b id="moves">0</b><span class="goal" id="goal">★★★ 0 이하</span></div>
    </div>
    <div class="dash-zone">
      <button class="dash" id="dash" aria-label="질주: 다음 갈림길까지 한 번에 이동">질주</button>
    </div>
  </aside>

  <div class="rotate-hint" id="rotate-hint" hidden>
    <span>휴대폰을 가로로 돌리면 더 편하게 할 수 있어요.</span>
    <button id="hint-close">닫기</button>
  </div>
</div>

<script>
(function () {
  "use strict";

  // ---------- rules ----------
  // 100 stages in 10 chapters. Each chapter steps up size, shortens the preview and burns the lamp faster.
  var STAGES = [];
  for (var si = 0; si < 100; si++) {
    var ch = Math.floor(si / 10), k = si % 10;
    var sz = Math.min(20, 7 + Math.floor(ch * 1.4) + (k >= 5 ? 1 : 0));
    STAGES.push({
      size: sz,
      preview: Math.max(0.5, Math.round((1.6 - ch * 0.1 - k * 0.01) * 100) / 100),
      secPerCell: Math.max(0.62, Math.round((1.4 - ch * 0.08 - k * 0.008) * 1000) / 1000),
      oils: si === 0 ? 0 : Math.min(5, 1 + Math.floor((sz - 7) / 3))
    });
  }
  var CHAPTERS = 10;
  function bonusConfig(chapter) {
    var last = STAGES[chapter * 10 + 9];
    return { size: Math.min(22, last.size + 2), preview: Math.max(0.45, last.preview - 0.1), secPerCell: Math.max(0.6, last.secPerCell - 0.03), oils: Math.min(6, last.oils + 1) };
  }
  var FREE = {
    7:  { size: 7,  preview: 1.2, secPerCell: 1.10, oils: 1 },
    10: { size: 10, preview: 1.0, secPerCell: 0.90, oils: 2 },
    15: { size: 15, preview: 0.8, secPerCell: 0.75, oils: 3 },
    20: { size: 20, preview: 0.7, secPerCell: 0.70, oils: 4 }
  };
  var OIL_SECONDS = 5;
  var GRACE_SECONDS = 3;
  var FADE_SECONDS = 0.25;
  // Player-adjustable: seconds per cell for speed levels 1–5, joystick dead zone (px) for sensitivity 1–3.
  var SPEED_LEVELS = [0.30, 0.24, 0.18, 0.14, 0.10];
  var STICK_DEAD_LEVELS = [24, 14, 7];
  // Light radius in tiles. Old start (3.2) = 10 on the brightness scale: full lamp = 20, never below 5.
  var LIGHT_MAX = 6.4;
  var LIGHT_MIN = 1.6;
  var CENTER_DARKNESS = 0.45;
  var MIN_SWIPE_PX = 24;
  var STORE_KEY = "lantern-maze-progress-v2";
  var SETTINGS_KEY = "lantern-maze-settings-v1";

  var DIRS = { up: { x: 0, y: -1 }, down: { x: 0, y: 1 }, left: { x: -1, y: 0 }, right: { x: 1, y: 0 } };
  var DIR_LIST = [DIRS.up, DIRS.right, DIRS.down, DIRS.left];

  var canvas = document.getElementById("game");
  var ctx = canvas.getContext("2d");
  function $(id) { return document.getElementById(id); }
  var el = {
    stage: $("stage-label"), kind: $("kind-label"), moves: $("moves"), goal: $("goal"),
    gauge: $("gauge"), gaugeFill: $("gauge-fill"),
    banner: $("banner"), bannerText: $("banner-text"),
    result: $("result"), resultTitle: $("result-title"), resultStars: $("result-stars"),
    resultLine: $("result-line"), resultNote: $("result-note"),
    retry: $("retry"), next: $("next"),
    pauseMenu: $("pause-menu"),
    select: $("select"), chapters: $("chapters"), grid: $("stage-grid"), summary: $("select-summary"), bonusBtn: $("bonus-btn"),
    board: $("board")
  };
  var colors = { stone: "#6f7c99", floor: "#141824", lamp: "#ffcf5a", oil: "#ff9f3a", exit: "#39d98a", danger: "255,90,79" };

  // ---------- storage ----------
  function readJson(key) {
    try { var raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : null; } catch (e) { return null; }
  }
  function writeJson(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* storage unavailable */ }
  }
  var progress = readJson(STORE_KEY) || {};
  if (!progress.stars) progress.stars = {};
  if (!progress.bonus) progress.bonus = {};
  if (!progress.free) progress.free = {};
  function saveProgress() { writeJson(STORE_KEY, progress); }

  var settings = readJson(SETTINGS_KEY) || {};
  ["sfx", "bgm", "vib"].forEach(function (key) { if (typeof settings[key] !== "boolean") settings[key] = true; });
  if (!(settings.speed >= 1 && settings.speed <= 5)) settings.speed = 3;
  if (!(settings.stick >= 1 && settings.stick <= 3)) settings.stick = 2;
  function saveSettings() { writeJson(SETTINGS_KEY, settings); }

  function starsFor(i) { return progress.stars[i] || 0; }
  function isUnlocked(i) { return i === 0 || starsFor(i - 1) > 0; }
  function chapterBonusUnlocked(chapter) {
    for (var i = chapter * 10; i < chapter * 10 + 10; i++) if (starsFor(i) < 3) return false;
    return true;
  }

  // ---------- sound (synthesised, no audio files) ----------
  var Sound = (function () {
    var ac = null, master, sfxBus, bgmBus, level = 0;

    // Background music: two original classical-style pieces that alternate, each played twice.
    // A: sonatina in C major (4/4, Alberti bass, piano-like). B: minuet in G major (3/4, harpsichord-like).
    // Note lists are [MIDI note, length in eighths]; 0 = rest.
    var PIECES = [
      {
        name: "sonatina", eighth: 60 / 92 / 2, perBar: 8, timbre: "piano",
        melody: [
          [72, 2], [76, 2], [79, 3], [77, 1],
          [76, 2], [74, 2], [74, 4],
          [79, 2], [81, 1], [79, 1], [77, 1], [76, 1], [74, 1], [72, 1],
          [77, 2], [81, 2], [79, 2], [77, 2],
          [76, 2], [79, 2], [84, 3], [83, 1],
          [81, 2], [79, 2], [76, 4],
          [74, 1], [76, 1], [77, 1], [79, 1], [77, 2], [74, 2],
          [72, 6], [0, 2]
        ],
        // Alberti bass: root, fifth, third, fifth on every eighth.
        alberti: [
          [48, 55, 52, 55], [43, 50, 47, 50], [48, 55, 52, 55], [41, 48, 45, 48],

  function resume() {
    if (state !== "paused") { el.pauseMenu.hidden = true; return; }
    state = pausedFrom || "playing";
    pausedFrom = null;
    el.pauseMenu.hidden = true;
    lastFrame = 0;
    Sound.setLevel(1);
    canvas.focus();
  }
  function handleBack() {
    if (!el.select.hidden) { closeSelect(); return true; }
    if (!el.pauseMenu.hidden) { resume(); return true; }
    if (isActive()) { pause(); return true; }
    if (!el.result.hidden) { pause(); return true; }
    return false;
  }

  // ---------- main loop ----------
  function updatePlaying(dt) {
    oil -= dt;
    flash = Math.max(0, flash - dt * 2);
    updateGauge();
    var f = oil / maze.lampMax;
    if (oil <= 0) { oil = 0; updateGauge(); lose(); return; }

    // Heartbeat when the lamp is low: faster as it runs out. Sound, buzz and red pulse share one clock.
    if (f < 0.25) {
      var rate = (1.6 + (0.25 - f) * 6) / 2;
      var before = beatPhase;
      beatPhase += dt * rate;
      if (Math.floor(beatPhase) > Math.floor(before)) { beatGlow = 1; Sound.beat(); buzz(25); }
    }
    beatGlow = Math.max(0, beatGlow - dt * 3);

    if (moving) {
      moving.t = Math.min(1, moving.t + dt / SPEED_LEVELS[settings.speed - 1]);
      drawPos.x = moving.from.x + (player.x - moving.from.x) * moving.t;
      drawPos.y = moving.from.y + (player.y - moving.from.y) * moving.t;
      if (moving.t < 1) return;
      moving = null;
      drawPos = { x: player.x, y: player.y };
      collectOil();
      if (player.x === maze.exit.x && player.y === maze.exit.y) { win(); return; }
      if (exitsAt(player) > 2) { slideDir = null; dashing = false; }
    }

    // Holding a direction cancels a swipe slide, but not a dash the player asked for.
    if (heldDir && !dashing) slideDir = null;
    var dir = dashing ? slideDir : (heldDir || slideDir);
    if (!dir) { dashing = false; return; }
    if (canMove(player, dir)) startMove(dir);
    else { slideDir = null; dashing = false; bumpWall(dir); }
  }

  function canMove(cell, dir) { return !maze.walls[cell.y * 2 + 1 + dir.y][cell.x * 2 + 1 + dir.x]; }
  function exitsAt(cell) { var c = 0; for (var i = 0; i < 4; i++) if (canMove(cell, DIR_LIST[i])) c++; return c; }

  function tick(now) {
    var dt = lastFrame ? Math.min(0.05, (now - lastFrame) / 1000) : 0;
    lastFrame = now;
    if (state !== "paused") clock += dt;
    if (state === "preview") {
      stateTimer += dt;
      if (stateTimer >= cfg.preview) {
        state = "fade"; stateTimer = 0;
        $("lamp-label").textContent = "등불"; $("lamp-label").className = "";
        el.board.classList.remove("memo");
        Sound.dark();
      }
    } else if (state === "fade") {
      stateTimer += dt;
      darkness = Math.min(1, stateTimer / FADE_SECONDS);
      if (darkness >= 1) state = "playing";
    } else if (state === "playing") {
      updatePlaying(dt);
    }
    Sound.update();
    updateCamera(dt);
    draw();
    requestAnimationFrame(tick);
  }

  // ---------- drawing ----------
  var cssSize = 0;
  function resize() {
    var w = el.board.getBoundingClientRect().width;
    if (!w) return;
    cssSize = w;
    var dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(cssSize * dpr);
    canvas.height = Math.round(cssSize * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  // Camera: the whole maze is shown while memorising and on the result screen;
  // during play the view zooms to a 10×10-cell window (21 tiles) that follows the player.
  var VIEW_TILES = 21;
  var cam = { span: 0, x: 0, y: 0, ready: false };
  function cameraTarget() {
    var full = maze.tiles;
    var zoomed = state === "fade" || state === "playing" || state === "paused";
    var span = zoomed ? Math.min(full, VIEW_TILES) : full;
    var half = span / 2;
    var tx = drawPos.x * 2 + 1.5, ty = drawPos.y * 2 + 1.5;
    return {
      span: span,
      x: Math.min(full - half, Math.max(half, tx)),
      y: Math.min(full - half, Math.max(half, ty))
    };
  }
  function updateCamera(dt) {
    if (!maze) return;
    var t = cameraTarget();
    if (!cam.ready) { cam.span = t.span; cam.x = t.x; cam.y = t.y; cam.ready = true; return; }
    var k = Math.min(1, dt * 7);
    cam.span += (t.span - cam.span) * k;
    cam.x += (t.x - cam.x) * k;
    cam.y += (t.y - cam.y) * k;
  }

  function draw() {
    if (!maze || !cssSize) return;
    var tile = cssSize / cam.span, x, y;
    var ox = cssSize / 2 - cam.x * tile;
    var oy = cssSize / 2 - cam.y * tile;
    ctx.fillStyle = colors.floor;
    ctx.fillRect(0, 0, cssSize, cssSize);
    ctx.fillStyle = colors.stone;
    var x0 = Math.max(0, Math.floor(-ox / tile)), x1 = Math.min(maze.tiles - 1, Math.ceil((cssSize - ox) / tile));
    var y0 = Math.max(0, Math.floor(-oy / tile)), y1 = Math.min(maze.tiles - 1, Math.ceil((cssSize - oy) / tile));
    for (y = y0; y <= y1; y++) for (x = x0; x <= x1; x++) {
      if (maze.walls[y][x]) ctx.fillRect(Math.floor(ox + x * tile), Math.floor(oy + y * tile), Math.ceil(tile) + 1, Math.ceil(tile) + 1);
    }
    ctx.fillStyle = colors.exit;
    ctx.fillRect(ox + (maze.exit.x * 2 + 1) * tile, oy + (maze.exit.y * 2 + 1) * tile, tile, tile);

    ctx.fillStyle = colors.oil;
    for (var i = 0; i < maze.oils.length; i++) {
      var o = maze.oils[i];
      if (o.taken) continue;
      ctx.beginPath();
      ctx.arc(ox + (o.x * 2 + 1.5) * tile, oy + (o.y * 2 + 1.5) * tile, tile * 0.32, 0, Math.PI * 2);
      ctx.fill();
    }

    var px = ox + (drawPos.x * 2 + 1.5) * tile;
    var py = oy + (drawPos.y * 2 + 1.5) * tile;
    var f = Math.max(0, Math.min(1, oil / maze.lampMax));

    if (darkness > 0) {
      var flicker = f < 0.25 ? 0.06 * Math.sin(clock * 23) : 0;
      var r = (LIGHT_MIN + (LIGHT_MAX - LIGHT_MIN) * f + flicker + flash * 0.8) * tile;
      var g = ctx.createRadialGradient(px, py, 0, px, py, r);
      g.addColorStop(0, "rgba(0,0,0," + CENTER_DARKNESS + ")");
      g.addColorStop(0.5, "rgba(0,0,0," + (CENTER_DARKNESS + (1 - CENTER_DARKNESS) * 0.5) + ")");
      g.addColorStop(1, "rgba(0,0,0,1)");
      ctx.globalAlpha = darkness;
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, cssSize, cssSize);
      ctx.globalAlpha = 1;

      if ((state === "playing" || state === "paused") && f < 0.25) {
        var edge = ctx.createRadialGradient(cssSize / 2, cssSize / 2, cssSize * 0.35, cssSize / 2, cssSize / 2, cssSize * 0.72);
        edge.addColorStop(0, "rgba(" + colors.danger + ",0)");
        edge.addColorStop(1, "rgba(" + colors.danger + "," + (0.12 + 0.3 * beatGlow) + ")");
        ctx.fillStyle = edge;
        ctx.fillRect(0, 0, cssSize, cssSize);
      }
    }

    var s = tile * 0.8;
    ctx.fillStyle = colors.lamp;
    ctx.fillRect(px - s / 2, py - s / 2, s, s);
  }

  // ---------- stage select ----------
  function chapterStars(chapter) {
    var total = 0;
    for (var i = chapter * 10; i < chapter * 10 + 10; i++) total += starsFor(i);
    return total;
  }
  function renderSelect() {
    var total = 0, i;
    for (i = 0; i < STAGES.length; i++) total += starsFor(i);
    el.summary.textContent = "모은 별 " + total + " / " + STAGES.length * 3;

    el.chapters.innerHTML = "";
    for (var c = 0; c < CHAPTERS; c++) {
      var cb = document.createElement("button");
      cb.className = "chapter";
      cb.id = "chapter-" + (c + 1);
      cb.disabled = !isUnlocked(c * 10);
      cb.setAttribute("aria-pressed", c === selChapter ? "true" : "false");
      cb.innerHTML = (c * 10 + 1) + "–" + (c * 10 + 10) + "<small>★ " + chapterStars(c) + "/30</small>";
      (function (idx) { cb.addEventListener("click", function () { selChapter = idx; Sound.click(); renderSelect(); }); })(c);
      el.chapters.appendChild(cb);
    }

    el.grid.innerHTML = "";
    for (i = selChapter * 10; i < selChapter * 10 + 10; i++) {
      var stars = starsFor(i);
      var b = document.createElement("button");
      b.className = "stage";
      b.id = "stage-" + (i + 1);
      b.disabled = !isUnlocked(i);
      var dots = "";
      for (var k = 0; k < 3; k++) dots += '<span class="' + (k < stars ? "on" : "") + '">★</span>';
      b.innerHTML = (i + 1) + "<small>" + dots + "</small>";
      b.setAttribute("aria-label", "스테이지 " + (i + 1) + ", 별 " + stars + "개" + (b.disabled ? ", 잠김" : ""));
      (function (idx) { b.addEventListener("click", function () { startLevel(idx); }); })(i);
      el.grid.appendChild(b);
    }

    var open = chapterBonusUnlocked(selChapter);
    var bonusStars = progress.bonus[selChapter] || 0;
    el.bonusBtn.disabled = !open;
    el.bonusBtn.innerHTML = "보너스 판 " + (selChapter + 1) + "<small>" + (open ? (bonusStars ? "★ " + bonusStars + "/3" : "도전 가능") : "이 챕터 모두 ★★★ 필요") + "</small>";
  }
  function openSelect() {
    if (isActive()) pause();
    el.pauseMenu.hidden = true;
    renderSelect();
    el.select.hidden = false;
    $("close-select").focus();
  }
  function closeSelect() {
    el.select.hidden = true;
    if (state === "paused") { el.pauseMenu.hidden = false; $("p-resume").focus(); }
  }

  // ---------- settings toggles ----------
  function renderToggles() {
    [["t-sfx", "sfx"], ["t-bgm", "bgm"], ["t-vib", "vib"]].forEach(function (pair) {
      var b = $(pair[0]);
      b.setAttribute("aria-pressed", settings[pair[1]] ? "true" : "false");
      b.querySelector("small").textContent = settings[pair[1]] ? "켜짐" : "꺼짐";
    });
  }
  [["t-sfx", "sfx"], ["t-bgm", "bgm"], ["t-vib", "vib"]].forEach(function (pair) {
    $(pair[0]).addEventListener("click", function () {
      settings[pair[1]] = !settings[pair[1]];
      saveSettings();
      renderToggles();
      Sound.refresh();
      if (pair[1] === "vib" && settings.vib) buzz(30);
      Sound.click();
    });
  });

  // ---------- speed and joystick sensitivity ----------
  function renderSteps() {
    [["speed-steps", "speed"], ["stick-steps", "stick"]].forEach(function (pair) {
      var buttons = $(pair[0]).querySelectorAll(".step");
      for (var i = 0; i < buttons.length; i++) {
        buttons[i].setAttribute("aria-pressed", parseInt(buttons[i].getAttribute("data-value"), 10) === settings[pair[1]] ? "true" : "false");
      }
    });
  }
  [["speed-steps", "speed"], ["stick-steps", "stick"]].forEach(function (pair) {
    var buttons = $(pair[0]).querySelectorAll(".step");
    for (var i = 0; i < buttons.length; i++) {
      buttons[i].addEventListener("click", function () {
        settings[pair[1]] = parseInt(this.getAttribute("data-value"), 10);
        saveSettings();
        renderSteps();
        Sound.click();
      });
    }
  });

  // ---------- input ----------
  var keyMap = { ArrowUp: "up", KeyW: "up", ArrowDown: "down", KeyS: "down", ArrowLeft: "left", KeyA: "left", ArrowRight: "right", KeyD: "right" };
  var keysDown = [];
  var padDir = null;
  function refreshHeld() { heldDir = keysDown.length ? DIRS[keysDown[keysDown.length - 1]] : (padDir ? DIRS[padDir] : null); }

  function unlockAudio() { Sound.unlock(); }
  window.addEventListener("pointerdown", unlockAudio);
  window.addEventListener("keydown", unlockAudio);

  window.addEventListener("keydown", function (e) {
    if (e.code === "Escape") { e.preventDefault(); handleBack(); return; }
    if (e.code === "KeyP") { e.preventDefault(); if (!el.pauseMenu.hidden) resume(); else pause(); return; }
    if (!el.select.hidden || state === "paused") return;
    if (e.code === "KeyR") { e.preventDefault(); startLevel(levelId); return; }
    if (e.code === "Space") { e.preventDefault(); dash(); return; }
    var name = keyMap[e.code];
    if (!name) return;
    e.preventDefault();
    if (keysDown.indexOf(name) === -1) keysDown.push(name);
    refreshHeld();
  });
  window.addEventListener("keyup", function (e) {
    var name = keyMap[e.code];
    if (!name) return;
    keysDown = keysDown.filter(function (k) { return k !== name; });
    refreshHeld();
  });
  window.addEventListener("blur", function () { keysDown = []; padDir = null; refreshHeld(); });
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) { pause(); Sound.suspend(); }
    else Sound.resume();
  });

  var swipeStart = null;
  canvas.addEventListener("pointerdown", function (e) { swipeStart = { x: e.clientX, y: e.clientY }; canvas.focus(); });
  canvas.addEventListener("pointerup", function (e) {
    if (!swipeStart) return;
    var dx = e.clientX - swipeStart.x, dy = e.clientY - swipeStart.y;
    swipeStart = null;
    if (state !== "playing" || (Math.abs(dx) < MIN_SWIPE_PX && Math.abs(dy) < MIN_SWIPE_PX)) return;
    if (Math.abs(dx) > Math.abs(dy)) slideDir = dx > 0 ? DIRS.right : DIRS.left;
    else slideDir = dy > 0 ? DIRS.down : DIRS.up;
  });
  canvas.addEventListener("pointercancel", function () { swipeStart = null; });

  // Left-thumb joystick: touch anywhere in the left zone, the stick appears under the thumb,
  // drag past the dead zone to pick one of four directions. Each finger is tracked separately.
  var stickZone = $("stick-zone"), stickEl = $("stick"), knob = $("knob");
  var stickId = null, stickOrigin = null;
  var STICK_RADIUS = 48;
  function setStickDir(name) {
    if (padDir === name) return;
    padDir = name;
    refreshHeld();
  }
  function releaseStick() {
    stickId = null;
    stickEl.classList.remove("active");
    stickEl.style.left = ""; stickEl.style.top = "";
    knob.style.transform = "";
    setStickDir(null);
  }
  stickZone.addEventListener("pointerdown", function (e) {
    if (stickId !== null) return;
    e.preventDefault();
    stickId = e.pointerId;
    try { stickZone.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
    var r = stickZone.getBoundingClientRect();
    stickOrigin = { x: e.clientX, y: e.clientY };
    stickEl.style.left = (e.clientX - r.left) + "px";
    stickEl.style.top = (e.clientY - r.top) + "px";
    stickEl.classList.add("active");
  });
  stickZone.addEventListener("pointermove", function (e) {
    if (e.pointerId !== stickId) return;
    var dx = e.clientX - stickOrigin.x, dy = e.clientY - stickOrigin.y;
    var d = Math.sqrt(dx * dx + dy * dy);
    var k = d > STICK_RADIUS ? STICK_RADIUS / d : 1;
    knob.style.transform = "translate(" + dx * k + "px," + dy * k + "px)";
    if (d < STICK_DEAD_LEVELS[settings.stick - 1]) { setStickDir(null); return; }
    setStickDir(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up"));
  });
  function endStick(e) { if (e.pointerId === stickId) releaseStick(); }
  stickZone.addEventListener("pointerup", endStick);
  stickZone.addEventListener("pointercancel", endStick);
  stickZone.addEventListener("lostpointercapture", endStick);
  stickZone.addEventListener("contextmenu", function (e) { e.preventDefault(); });

  // Right-thumb dash: runs in the current (or last) direction until the next junction or wall.
  function dash() {
    if (state !== "playing") return;
    var d = heldDir || lastDir;
    if (!d || !canMove(player, d)) { if (d) bumpWall(d); return; }
    slideDir = d;
    dashing = true;
    Sound.click();
  }
  var dashBtn = $("dash");
  dashBtn.addEventListener("pointerdown", function (e) {
    e.preventDefault();
    dashBtn.classList.add("on");
    dash();
  });
  ["pointerup", "pointercancel", "pointerleave"].forEach(function (t) { dashBtn.addEventListener(t, function () { dashBtn.classList.remove("on"); }); });
  dashBtn.addEventListener("contextmenu", function (e) { e.preventDefault(); });

  // Suggest landscape on touch phones held upright.
  var hintClosed = false;
  function updateRotateHint() {
    var portrait = window.matchMedia("(orientation: portrait)").matches;
    var touch = window.matchMedia("(pointer: coarse)").matches;
    $("rotate-hint").hidden = hintClosed || !(portrait && touch);
  }
  $("hint-close").addEventListener("click", function () { hintClosed = true; updateRotateHint(); });
  window.addEventListener("resize", updateRotateHint);
  updateRotateHint();

  // ---------- modes ----------
  function furthestStage() {
    var at = 0;
    for (var s = 0; s < STAGES.length; s++) if (isUnlocked(s)) at = s;
    return at;
  }
  function updateRecord() {
    var rec = progress.free[freeSize];
    $("record").textContent = rec ? "탈출 " + rec.clears + "회 · ★★★ " + rec.three + "회" : "아직 기록 없음";
  }
  function setMode(next) {
    mode = next;
    $("mode-stage").setAttribute("aria-pressed", mode === "stage" ? "true" : "false");
    $("mode-free").setAttribute("aria-pressed", mode === "free" ? "true" : "false");
    $("open-select").hidden = mode !== "stage";
    $("sizes").hidden = mode !== "free";
    $("record").hidden = mode !== "free";
    if (mode === "free") { updateRecord(); newFree(); }
    else startLevel(furthestStage());
  }

  $("mode-stage").addEventListener("click", function () { if (mode !== "stage") setMode("stage"); });
  $("mode-free").addEventListener("click", function () { if (mode !== "free") setMode("free"); });
  var chips = document.querySelectorAll(".chip");
  for (var c = 0; c < chips.length; c++) {
    chips[c].addEventListener("click", function () {
      freeSize = parseInt(this.getAttribute("data-size"), 10);
      for (var k = 0; k < chips.length; k++) chips[k].setAttribute("aria-pressed", chips[k] === this ? "true" : "false");
      updateRecord();
      newFree();
    });
  }

  el.retry.addEventListener("click", function () { startLevel(levelId); });
  el.next.addEventListener("click", goNext);
  $("pause").addEventListener("click", function () { Sound.click(); if (!el.pauseMenu.hidden) resume(); else pause(); });
  $("p-resume").addEventListener("click", resume);
  $("p-restart").addEventListener("click", function () { startLevel(levelId); });
  $("open-select").addEventListener("click", openSelect);
  $("close-select").addEventListener("click", closeSelect);
  el.bonusBtn.addEventListener("click", function () { if (chapterBonusUnlocked(selChapter)) startLevel("b" + selChapter); });

  window.addEventListener("resize", resize);
  if (window.ResizeObserver) new ResizeObserver(resize).observe(el.board);

  startLevel(furthestStage());
  requestAnimationFrame(tick);

  // Hook for a native wrapper (e.g. Android back button): returns true when handled.
  window.LanternMaze = { back: handleBack, pause: pause, resume: resume };
  window.__lanternMaze = { buildLevel: buildLevel, bfs: bfs, STAGES: STAGES, bonusConfig: bonusConfig, seedFor: seedFor, current: function () { return maze; }, state: function () { return state; } };
})();
</script>

<script>
/* Native app glue (Capacitor): Android back button and app pause. Does nothing in a browser. */
(function () {
  var Cap = window.Capacitor;
  if (!Cap || !Cap.isNativePlatform || !Cap.isNativePlatform()) return;
  var App = Cap.Plugins && Cap.Plugins.App;
  if (!App) return;
  App.addListener("backButton", function () {
    if (window.LanternMaze) window.LanternMaze.back();
  });
  App.addListener("pause", function () {
    if (window.LanternMaze) window.LanternMaze.pause();
  });
})();
</script>
</body>
</html>
