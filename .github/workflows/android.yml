name: Build Android test APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install packages
        run: npm ci

      - name: Copy the game into the Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Keep the APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: lantern-maze-test-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # Replaces the "test-build" release so the newest APK is always at the same download page.
      - name: Publish the APK to the test-build release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk lantern-maze-test.apk
          gh release delete test-build --yes --cleanup-tag || true
          gh release create test-build lantern-maze-test.apk \
            --title "Lantern Maze test build" \
            --notes "Test build from commit ${GITHUB_SHA::7}. Install on an Android phone to try the game." \
            --prerelease

      # Web version for iPhone and PC: landing page at the root, game at /play/, served by GitHub Pages
      # from the gh-pages branch (Settings → Pages → Deploy from a branch → gh-pages).
      - name: Publish the web version to gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./site/build.sh
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Web build from ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
